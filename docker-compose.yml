services:
  peiyin:
    build: .
    container_name: peiyin
    # 随用随开：手动 up / stop，不自动重启
    restart: "no"
    ports:
      - "${PORT:-8756}:8756"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      # 用免登录端点，设了 APP_PASSWORD 也不会被鉴权拦成 401
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8756/api/auth-status').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
